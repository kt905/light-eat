# Render Blueprint —— 免费 Web Service（闲置约 15 分钟休眠，冷启动 30~60s）
# 说明：识别已统一走浏览器端本地 AI（CLIP），无需 API Key；后端仅做静态托管与模型代理
# 用法：
#   1) 把仓库推送到 GitHub
#   2) Render 控制台 → New → Blueprint → 选择本仓库
services:
  - type: web
    name: light-eat
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    # 根目录装 Tailwind 依赖并构建 CSS，再装后端依赖
    buildCommand: npm ci --include=dev && npm run build:css && cd server && npm ci
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
